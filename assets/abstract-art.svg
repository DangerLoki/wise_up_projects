<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Abstract art composition</title>
  <desc id="desc">An abstract composition representing painting, geometry, and visual creativity.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1930"/>
      <stop offset="1" stop-color="#080d1a"/>
    </linearGradient>

    <linearGradient id="strokeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48e6ff"/>
      <stop offset="1" stop-color="#6282ff"/>
    </linearGradient>

    <linearGradient id="strokeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff58c5"/>
      <stop offset="1" stop-color="#ff9d4d"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" rx="28" fill="url(#background)"/>

  <circle cx="160" cy="150" r="110" fill="#ff58c5" opacity=".25"/>
  <circle cx="650" cy="160" r="90" fill="#48e6ff" opacity=".22"/>
  <circle cx="595" cy="465" r="125" fill="#ff9d4d" opacity=".22"/>
  <circle cx="205" cy="455" r="95" fill="#bfff63" opacity=".18"/>

  <path d="M70 390 C180 250 300 520 430 350 C540 205 660 255 750 145"
        fill="none" stroke="url(#strokeA)" stroke-width="28"
        stroke-linecap="round" filter="url(#softGlow)"/>

  <path d="M80 165 C210 315 310 80 455 240 C560 355 650 330 735 470"
        fill="none" stroke="url(#strokeB)" stroke-width="24"
        stroke-linecap="round" filter="url(#softGlow)"/>

  <g fill="none" stroke="#f4f8ff" opacity=".72">
    <rect x="290" y="170" width="220" height="220" transform="rotate(12 400 280)" stroke-width="5"/>
    <polygon points="400,105 535,330 265,330" stroke-width="5"/>
    <circle cx="400" cy="300" r="155" stroke-width="4" stroke-dasharray="14 16"/>
  </g>

  <g fill="#f4f8ff">
    <circle cx="130" cy="515" r="9"/>
    <circle cx="690" cy="95" r="7"/>
    <circle cx="720" cy="530" r="11"/>
    <circle cx="95" cy="85" r="6"/>
  </g>

  <text x="400" y="565" text-anchor="middle" fill="#f4f8ff"
        font-family="Arial, sans-serif" font-size="24" font-weight="700"
        letter-spacing="7">ART · CREATIVITY</text>
</svg>