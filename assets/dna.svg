<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">DNA molecule</title>
  <desc id="desc">A clean static illustration of a DNA double helix.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>

    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48e6ff"/>
      <stop offset="1" stop-color="#6282ff"/>
    </linearGradient>

    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfff63"/>
      <stop offset="1" stop-color="#48e6ff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" rx="28" fill="url(#bg)"/>

  <g opacity=".25">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800" stroke="#48e6ff"/>
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600" stroke="#48e6ff"/>
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M260 70 C560 140 560 230 260 300 C-40 370 -40 460 260 530"
          transform="translate(140 0)"
          stroke="url(#left)"
          stroke-width="18"/>

    <path d="M540 70 C240 140 240 230 540 300 C840 370 840 460 540 530"
          transform="translate(-140 0)"
          stroke="url(#right)"
          stroke-width="18"/>
  </g>

  <g stroke-linecap="round" stroke-width="11">
    <line x1="315" y1="105" x2="485" y2="105" stroke="#ff58c5"/>
    <line x1="270" y1="155" x2="530" y2="155" stroke="#ff9d4d"/>
    <line x1="255" y1="210" x2="545" y2="210" stroke="#48e6ff"/>
    <line x1="300" y1="265" x2="500" y2="265" stroke="#bfff63"/>
    <line x1="350" y1="320" x2="450" y2="320" stroke="#ff58c5"/>
    <line x1="285" y1="375" x2="515" y2="375" stroke="#ff9d4d"/>
    <line x1="255" y1="430" x2="545" y2="430" stroke="#48e6ff"/>
    <line x1="295" y1="485" x2="505" y2="485" stroke="#bfff63"/>
  </g>

  <text x="400" y="575" text-anchor="middle" fill="#dcefff"
        font-family="Arial, sans-serif" font-size="24" font-weight="700"
        letter-spacing="6">BIOLOGY · DNA</text>
</svg>